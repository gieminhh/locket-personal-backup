# Personal Shadowrocket test config. Replace GITHUB_USER and REPO_NAME AFTER upload.
# Public raw GitHub paths work without authentication; PRIVATE repos do NOT.
# No auto-update-url to protect local snapshots.
[General]

[Header Rewrite]
http-request ^https?:\/\/(api\.revenuecat\.com|api\.rc-backup\.com)\/.+\/(receipts$|subscribers\/?(.*)?$) header-del x-revenuecat-etag
http-request ^https?:\/\/firebaseremoteconfig\.googleapis\.com\/.+ header-del if-none-match
http-request ^https?:\/\/firebaseremoteconfig\.googleapis\.com\/.+ header-del if-modified-since

[Script]
Locket_Header = type=http-request,pattern=^https?:\/\/(api\.revenuecat\.com|api\.rc-backup\.com)\/.+\/(receipts$|subscribers\/?(.*)?$),script-path=https://raw.githubusercontent.com/GITHUB_USER/REPO_NAME/main/scripts/HeaderClean.js,timeout=60
Locket_Gold = type=http-response,pattern=^https?:\/\/(api\.revenuecat\.com|api\.rc-backup\.com)\/.+\/(receipts$|subscribers\/?(.*)?$),script-path=https://raw.githubusercontent.com/GITHUB_USER/REPO_NAME/main/scripts/Gold.js,requires-body=1,max-size=-1,timeout=60
Locket_Custom = type=http-response,pattern=^https?:\/\/firebaseremoteconfig\.googleapis\.com\/v1\/projects\/.*,script-path=https://raw.githubusercontent.com/GITHUB_USER/REPO_NAME/main/scripts/RemoteConfig.js,requires-body=1,max-size=-1,timeout=60,argument=name=Personal&startDate=2024-02-14&hd=true

[MITM]
enable = true
hostname = %APPEND% api.revenuecat.com, api.rc-backup.com, firebaseremoteconfig.googleapis.com
